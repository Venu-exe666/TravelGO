<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <aside th:fragment="consultant-sidebar(activeTab)" class="admin-sidebar sidebar--package">
        <!-- Figma: Logo-Section (2:1204) -->
        <div class="sidebar-header">
            <a th:href="@{/staff/package-dashboard}" class="sidebar-logo">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                </div>
                <span>Travel<span class="accent">GO</span></span>
            </a>
            <span class="sidebar-logo-badge">PACKAGE MANAGER</span>
        </div>

        <div class="sidebar-section-title">Terminal Navigation</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                <a th:href="@{/staff/package-dashboard}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                        <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                        <rect x="3" y="16" width="7" height="5" rx="1"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'packages'} ? 'active' : ''">
                <a th:href="@{/staff/packages}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span>Tour Packages</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'hotels'} ? 'active' : ''">
                <a th:href="@{/staff/hotels}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16"></path>
                        <path d="M1 21h22"></path>
                        <path d="M9 9h1"></path>
                        <path d="M9 13h1"></path>
                        <path d="M9 17h1"></path>
                        <path d="M14 9h1"></path>
                        <path d="M14 13h1"></path>
                        <path d="M14 17h1"></path>
                    </svg>
                    <span>Hotels &amp; Partners</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'inquiries'} ? 'active' : ''">
                <a th:href="@{/staff/inquiries}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Inquiries</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'destinations'} ? 'active' : ''">
                <a th:href="@{/staff/destinations}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>Destinations</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'reports'} ? 'active' : ''">
                <a th:href="@{/staff/reports}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                    </svg>
                    <span>Reports</span>
                </a>
            </li>
        </ul>

        <!-- Figma: Profile-Chip (2:1234) -->
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="user-avatar">MV</div>
                <div class="user-info">
                    <div class="user-name">Marcus Vance</div>
                    <span class="user-role-badge">PACKAGE MANAGER</span>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post" style="margin: 0; width: 100%;">
                <button type="submit" class="btn-logout" style="width: 100%; border: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sign Out Terminal
                </button>
            </form>
        </div>
        <script th:src="@{/js/theme.js}"></script>
        <script th:src="@{/js/staff-ui.js}" defer></script>
    </aside>
</body>
</html>
