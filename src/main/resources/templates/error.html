<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Encountered - TravelGO</title>
    <link rel="stylesheet" th:href="@{/css/premium.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-main); text-align: center; padding: 2rem; position: relative; overflow: hidden;">


    <!-- Ambient Glow Orbs -->
    <div class="ambient-glow-orb ambient-orb-1" style="opacity: 0.35;"></div>
    <div class="ambient-glow-orb ambient-orb-2" style="opacity: 0.25;"></div>

    <div class="card tilt-card glass-card-interactive reveal-scale" style="max-width: 540px; width: 100%; padding: 3.5rem 2.5rem; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); border-radius: 24px; position: relative; z-index: 2; border: 1px solid rgba(255, 255, 255, 0.1);">
        <div style="width: 72px; height: 72px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: #EF4444;">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 36px; height: 36px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        
        <h1 style="font-size: 2rem; margin-bottom: 1rem; color: #FFFFFF;">System Notice</h1>
        <p style="color: #94A3B8; font-size: 1.05rem; line-height: 1.7; margin-bottom: 2.25rem;" th:text="${errorMessage != null ? errorMessage : 'An unexpected condition occurred while processing your request. Please return to the homepage or try again.'}">
            An unexpected error occurred.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary btn-lg btn-shimmer">Return to TravelGO Home</a>
        </div>
    </div>

    <!-- UI Scripts -->
    <script th:src="@{/js/immersive-effects.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
