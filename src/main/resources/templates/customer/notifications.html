<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/theme.js}"></script>
    <title>My Notifications - TravelGO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">
    <h2>My Notifications</h2>

    <div class="card">
        <div class="card-body">
            <div th:each="notification : ${notifications}" class="border-bottom py-3">
                <div class="d-flex justify-content-between">
                    <h6 th:text="${notification.title}" th:classappend="${!notification.read} ? 'fw-bold' : ''"></h6>
                    <small class="text-muted" th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                </div>
                <p class="mb-0 text-muted" th:text="${notification.message}"></p>
                <span th:unless="${notification.read}" class="badge bg-primary">New</span>
            </div>
            <p th:if="${#lists.isEmpty(notifications)}" class="text-muted py-3">No notifications yet.</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
